<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTRC Sermon Cover</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
        font-family: "DM Serif Display", serif;
      }

      html, body, form {
        width: 1vw;
        height: 1vh;
        min-height: 100%;
        display: grid;
        place-items: start;
      }

      #background {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #2b633b;
        box-shadow: 15px 25px 55px 5px rgba(0, 0, 0, 1);
        transform-origin: top left;
        scale: 50%;
      }

      #portrait {
        position: absolute;
        left: -60px;
        top: 50px;
        width: 460px;
        height: 675px;
        border-bottom-right-radius: 100px;
        cursor: pointer;
      }

      #logo {
        position: absolute;
        left: 475px;
        top: 20px;
        width: 750px;
        height: auto;
      }

      #textbox {
        position: relative;
        left: 460px;
        top: 310px;
        width: 710px;
        height: auto;
      }

      p {
        text-anchor: start;
        color: white;
        text-transform: uppercase;
        font-size: 45pt;
        line-height: 93%;
        background: transparent;
        outline: none;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .interactive {
        cursor: text;
      }

      .interactive:focus,
      .interactive:hover {
        outline: 1px solid #fff4;
        background: #fff1;
      }

      .interactive:empty:before {
        content: attr(data-placeholder);
        color: #fffb;
      }

      #preacher {
        text-transform: none;
        font-size: 40pt;
        margin-top: 70px;
        cursor: pointer;
      }

      #gradient {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 265px;
        background: linear-gradient(180deg, #fff0 0%, #fff 100%);
        pointer-events: none;
      }

      #preacher-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        width: min(640px, 80vw);
        max-height: 70vh;
        overflow-y: auto;
        padding: 12px;
        align-items: start;
      }

      .preacher-option {
        display: grid;
        gap: 6px;
        border: 2px solid transparent;
        padding: 6px;
        color: #222;
        background: #eee;
        cursor: pointer;
        font: inherit;
        align-self: start;
        height: fit-content;
      }

      .preacher-option:hover,
      .preacher-option:focus-visible,
      .preacher-option[aria-selected="true"] {
        border-color: #2b633b;
      }

      .preacher-option img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #aaa;
        align-self: start;
        height: auto;
      }

      .preacher-option span {
        min-height: 2.4em;
        line-height: 1.2;
        overflow-wrap: anywhere;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <form>
      <label for="wav">Select .wav file</label>
      <input id="wav" type="file" accept=".wav" onchange="document.getElementById('in').src"/>
      <audio hidden="true" id="in" controls src=""></audio>
      <hr>
      <label for="zoom">Preview Zoom (does not affect export)</label>
      <input id="zoom" type="range" min="50" max="150" value="100" step="1" oninput="document.getElementById('background').style.transform = 'scale(' + (this.value / 100) + ')'" />
      <br>
      <div id="background">
        <img id="portrait" src="Preachers/Spiderman.png" onclick="selectPreacher()"/>
        <img id="logo" src="CTRC-Logo-1200x400.png"/>
        <div id="gradient"></div>
        <div id="textbox">
          <p id="sermon" class="interactive" contenteditable="true" spellcheck="false" data-placeholder="Sermon title, auto-breaking as necessary"></p>
          <p id="passage" class="interactive" contenteditable="true" spellcheck="false" data-placeholder="1 Hezekiah 23:45-67:89"></p>
          <p id="preacher" class="interactive" onclick="selectPreacher()">Spiderman</p>
        </div>
      </div>
      <dialog id="select-preacher" closedby="any">
        <span>Portrait Selection</span>
        <div id="preacher-grid"></div>
      </dialog>
    </form>
    <output hidden="true">
      <audio id="out" controls src=""></audio>
    </output>
    <script>
      const dialog = document.getElementById('select-preacher')
      const portrait = document.getElementById('portrait');
      const preacher = document.getElementById('preacher');
      const preacherGrid = document.getElementById('preacher-grid');
      let selectedTile = null;

      const addOption = (name) => {
        const imagePath = `Preachers/${name}.png`;

        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'preacher-option';
        tile.innerHTML = `<img src="${imagePath}" alt=""><span>${name}</span>`;
        tile.addEventListener('click', () => {
          preacher.textContent = name;
          portrait.src = imagePath;
          dialog.close();
          if (selectedTile) {
            selectedTile.setAttribute('aria-selected', 'false');
          }
          selectedTile = tile;
          selectedTile.setAttribute('aria-selected', 'true');
        });
        preacherGrid.append(tile);

        return tile;
      };

      var placeholder = addOption('Spiderman');
      [
        'Joshua Dockter', // TODO: Replace with dynamic insertion of images
        'Joshua Dockter2',
        'Joshua Dockter3',
        'Very long preacher name Alphonsonicus the VII of 1200s A.D. Valencia, Spain',
        'Jo',
      ].forEach(addOption);

      function selectPreacher() {
        if (placeholder) {
          preacherGrid.removeChild(placeholder);
          placeholder = null;
        }
        dialog.showModal();
      }
    </script>
  </body>
</html>
