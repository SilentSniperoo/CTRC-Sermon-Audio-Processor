<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTRC Sermon Cover</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
        font-family: "DM Serif Display", serif;
      }

      html, body {
        min-height: 100%;
        display: grid;
        place-items: center;
      }

      #background {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #2b633b;
        box-shadow: 15px 25px 55px 5px rgba(0, 0, 0, 1);
      }

      #portrait {
        position: absolute;
        left: -60px;
        top: 50px;
        width: 460px;
        height: 675px;
        overflow: hidden;
        border-bottom-right-radius: 100px;
      }

      #logo {
        position: absolute;
        left: 475px;
        top: 20px;
        width: 750px;
        height: auto;
        overflow: hidden;
      }

      #textbox {
        position: relative;
        left: 460px;
        top: 310px;
        width: 710px;
        height: auto;
        overflow: hidden;
      }

      p {
        color: white;
        text-transform: uppercase;
        font-size: 45pt;
        line-height: 93%;
      }

      #preacher {
        text-transform: none;
        font-size: 40pt;
        margin-top: 70px;
      }

      #gradient {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 265px;
        background: linear-gradient(180deg, #fff0 0%, #fff 100%);
      }
    </style>
  </head>
  <body>
    <div id="background">
      <img id="portrait" src="Preachers/Joshua Dockter.png"/>
      <img id="logo" src="CTRC-Logo-1200x400.png"/>
      <div id="textbox">
        <p id="sermon">
          Sermon title, auto-breaking as necessary
        </p>
        <p id="passage">
          1 Hezekiah 23:45-67:89
        </p>
        <p id="preacher">
          Joshua Dockter
        </p>
      </div>
      <div id="gradient"></div>
    </div>
  </body>
</html>
